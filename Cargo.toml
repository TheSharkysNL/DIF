[package]
name = "dilian"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "A lightweight crate for dependency injection."

[features]
macros = ["dilian_macros"]
async = ["dilian_core/async"]
globals = ["dilian_core/globals"]

[dependencies]
dilian_core = { path = "dilian_core", version = "1.0.0" }
dilian_macros = { path = "dilian_macros", version = "1.0.0", optional = true }

[dev-dependencies]
generic-tests = "0.1.3"

[workspace]
resolver = "3"
members = ["dilian_core", "dilian_macros"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]